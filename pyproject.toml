[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "keeplane-cli"
version = "0.0.0"
description = "Keeplane's developer CLI integration trial"
readme = "components/cli/README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3 :: Only",
]

[project.scripts]
keeplane = "keeplane_cli.keeplane:main"

[tool.setuptools]
packages = ["keeplane_cli"]
package-dir = {keeplane_cli = "components/cli"}
include-package-data = false

[tool.setuptools.package-data]
keeplane_cli = ["instruction_plugin/index.js", "instruction_plugin/package.json"]
