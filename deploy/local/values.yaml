app:
  image: keeplane-preview:kind-local
  pullPolicy: Never
  localTrial:
    enabled: true
    firstAdminSecret: keeplane-first-admin
    publicOrigin: http://127.0.0.1:13000
    publicOriginAliases: http://localhost:13000
  service:
    type: NodePort
    nodePort: 30080

gateway:
  mode: managed
  install: true

agentgateway-standalone:
  podSecurityContext:
    fsGroup: 65532
  extraVolumes:
    - name: provider-keys
      persistentVolumeClaim:
        claimName: keeplane-provider-keys
  extraVolumeMounts:
    - name: provider-keys
      mountPath: /provider-keys
      readOnly: true
  database:
    postgres:
      url: postgresql://keeplane:local-test-only@postgres:5432/keeplane
  config:
    gateways:
      default:
        port: 4000
    ui:
      gateways: default
    llm:
      models:
        - name: local-fixture
          provider:
            custom:
              formats:
                - type: completions
          params:
            model: mock-local
            baseUrl: http://model:18080/v1
