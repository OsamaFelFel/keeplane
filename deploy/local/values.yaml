app:
  image: keeplane-preview:kind-local
  pullPolicy: Never
  localTrial:
    enabled: true
    firstAdminSecret: keeplane-first-admin
    publicOrigin: http://127.0.0.1:13000
    publicOriginAliases: http://localhost:13000
    openAIBaseUrl: http://cloud-provider:18082/v1
    anthropicBaseUrl: http://cloud-provider:18082/v1
  service:
    type: NodePort
    nodePort: 30080

gateway:
  mode: managed
  install: true
  keysSecret: keeplane-gateway-keys

agentgateway-standalone:
  # The chart requires both key-hash entries from gateway.keysSecret.
  extraEnv:
    - name: KEEPLANE_DB_PASSWORD
      valueFrom:
        secretKeyRef:
          name: keeplane-gateway-db
          key: password
    - name: GATEWAY_RUNTIME_KEY_HASH
      valueFrom:
        secretKeyRef:
          name: keeplane-gateway-keys
          key: runtime-key-hash
    - name: GATEWAY_ADMIN_KEY_HASH
      valueFrom:
        secretKeyRef:
          name: keeplane-gateway-keys
          key: admin-key-hash
  podSecurityContext:
    # Keys already belong to the gateway's UID. Do not widen this shared PVC.
    fsGroup: null
  extraVolumes:
    - name: provider-keys
      persistentVolumeClaim:
        claimName: keeplane-provider-keys
  extraVolumeMounts:
    - name: provider-keys
      mountPath: /provider-keys
      readOnly: true
  database:
    postgres:
      url: postgresql://keeplane:${KEEPLANE_DB_PASSWORD}@postgres:5432/keeplane
  # The chart adds the strict key policies for management and model calls.
  config:
    llm:
      models:
        - name: local-fixture
          provider:
            custom:
              formats:
                - type: completions
          params:
            model: mock-local
            baseUrl: http://model:18080/v1
