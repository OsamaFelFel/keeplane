# The local kind cluster with the protected developer release
# (KEEPLANE_KIND_PROTECTED=on in kind-up.sh): the same node as kind.yaml, plus
# the ingress controller's HTTPS port 443, published only on this computer's
# loopback address, for https://keeplane.kind.test.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 13000
        listenAddress: 127.0.0.1
      - containerPort: 443
        hostPort: 443
        listenAddress: 127.0.0.1
