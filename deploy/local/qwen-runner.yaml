# Real local Qwen model for the single-node kind integration trial.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qwen
  template:
    metadata:
      labels:
        app: qwen
    spec:
      containers:
        - name: qwen
          image: ghcr.io/ggml-org/llama.cpp@sha256:33868c035b21dc63f7c60b7438774283fd99215bc319114eb03de5df4ce7cd6b
          imagePullPolicy: IfNotPresent
          args:
            - -m
            - /models/qwen2.5-coder-0.5b-instruct-q4_k_m.gguf
            - --alias
            - qwen2.5-coder:0.5b
            - --host
            - 0.0.0.0
            - --port
            - "8080"
            - --ctx-size
            - "4096"
            - -n
            - "256"
          ports:
            - containerPort: 8080
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 5
          volumeMounts:
            - name: model
              mountPath: /models
              readOnly: true
      volumes:
        - name: model
          hostPath:
            path: /models
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: qwen
spec:
  selector:
    app: qwen
  ports:
    - name: http
      port: 8080
      targetPort: 8080
