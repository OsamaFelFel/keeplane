# Disposable authenticated model-provider fixture for the local kind preview.
# It serves HTTPS with the test certificate kind-up.sh makes on every start
# (Secret cloud-provider-tls); the app and gateway copies trust its CA through
# trust.extraCaBundle in values.yaml. The protected release
# (kind_protected.py) runs its own copy in its namespace and reaches it on
# port 443 as api.openai.com.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-provider
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloud-provider
  template:
    metadata:
      labels:
        app: cloud-provider
    spec:
      automountServiceAccountToken: false
      containers:
        - name: cloud-provider
          image: python@sha256:2d9aefe2fef018a7eb2c13064c89c71929800fd2e5dccdbf52ea5da5bb8d929a
          imagePullPolicy: IfNotPresent
          command: ["python", "/fixture/cloud_provider.py"]
          env:
            - name: TRIAL_KEY_FILE
              value: /run/provider-key/key
            - name: TLS_CERT_FILE
              value: /run/tls/provider.pem
            - name: TLS_KEY_FILE
              value: /run/tls/provider.key
          ports:
            - containerPort: 18443
          readinessProbe:
            httpGet:
              path: /health
              port: 18443
              scheme: HTTPS
            periodSeconds: 5
          volumeMounts:
            - name: fixture
              mountPath: /fixture
              readOnly: true
            - name: provider-key
              mountPath: /run/provider-key
              readOnly: true
            - name: tls
              mountPath: /run/tls
              readOnly: true
      volumes:
        - name: fixture
          configMap:
            name: cloud-provider-fixture
        - name: provider-key
          secret:
            secretName: cloud-provider-key
        - name: tls
          secret:
            secretName: cloud-provider-tls
---
apiVersion: v1
kind: Service
metadata:
  name: cloud-provider
spec:
  selector:
    app: cloud-provider
  ports:
    - name: https
      port: 18443
      targetPort: 18443
    - name: https-default
      port: 443
      targetPort: 18443
