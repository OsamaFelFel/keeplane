{{- if eq .Values.gateway.mode "existing" }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-existing-gateway-preflight
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 90
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.app.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: preflight
          image: {{ .Values.app.image | quote }}
          imagePullPolicy: {{ .Values.app.pullPolicy }}
          command: ["python", "/app/gateway_preflight.py"]
          env:
            - name: GATEWAY_URL
              value: {{ required "gateway.url is required in existing mode" .Values.gateway.url | quote }}
            - name: EXPECTED_GATEWAY_VERSION
              value: {{ required "gateway.expectedVersion is required in existing mode" .Values.gateway.expectedVersion | quote }}
            - name: GATEWAY_PREFLIGHT_MODEL
              value: {{ .Values.gateway.preflightModel | quote }}
            {{- if .Values.gateway.keysSecret }}
            - name: GATEWAY_RUNTIME_KEY_FILE
              value: /run/gateway-keys/runtime-key
            - name: GATEWAY_ADMIN_KEY_FILE
              value: /run/gateway-keys/admin-key
            {{- end }}
          {{- if .Values.gateway.keysSecret }}
          volumeMounts:
            - name: gateway-keys
              mountPath: /run/gateway-keys
              readOnly: true
          {{- end }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          {{- with .Values.app.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- if .Values.gateway.keysSecret }}
      volumes:
        - name: gateway-keys
          secret:
            secretName: {{ .Values.gateway.keysSecret | quote }}
      {{- end }}
{{- end }}
