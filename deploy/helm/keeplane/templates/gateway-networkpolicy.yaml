{{- /*
Opt-in ingress policy for the managed gateway copies. Only this release's app
pods reach port 4000 (model calls and management). With the model enroller,
the public entry (networkPolicy.publicEntry, your ingress controller) also
reaches the protected runtime's port 5000, the backend of the Ingress path
/v1/chat/completions; it never reaches port 4000. The enroller check refuses
the enroller with this policy and no public entry, which would leave the
protected port unreachable.
*/ -}}
{{- if .Values.networkPolicy.gatewayIngressEnabled }}
{{- if ne .Values.gateway.mode "managed" }}
{{- fail "networkPolicy.gatewayIngressEnabled belongs to managed mode; secure a supplied gateway in its own installation" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-gateway-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: agentgateway-standalone
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: {{ .Release.Name }}-app
      ports:
        - protocol: TCP
          port: 4000
    {{- if include "keeplane.enroller.on" . }}
    - from:
        {{- include "keeplane.networkPolicy.peer" (list "networkPolicy.publicEntry" (.Values.networkPolicy.publicEntry | default dict)) | nindent 8 }}
      ports:
        - protocol: TCP
          port: 5000
    {{- end }}
{{- end }}
