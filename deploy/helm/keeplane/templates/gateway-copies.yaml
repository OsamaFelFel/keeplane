{{- /*
The managed gateway's serving copies. The bundled gateway chart runs its pods
as a Deployment, whose pods have no stable address, so the app could not read
each copy back after a model change. This StatefulSet runs the same container
from the same agentgateway-standalone values and the bundled chart's
ConfigMap, and the headless Service gives copy N the private address
<release>-gateway-N.<release>-gateway-copies.<namespace>.svc on port 4000.
The app's GATEWAY_COPY_URLS is rendered from gateway.copies (see app.yaml), so
the list always matches the number of copies. The pods carry the bundled
chart's selector labels: the gateway Service and the gateway NetworkPolicy
select them unchanged. The bundled Deployment stays at zero replicas.
*/ -}}
{{- if and (eq .Values.gateway.mode "managed") .Values.gateway.install }}
{{- $gw := index .Values "agentgateway-standalone" }}
{{- $copies := int .Values.gateway.copies }}
{{- if or (lt $copies 1) (gt $copies 32) }}
{{- fail "gateway.copies must be a whole number from 1 to 32" }}
{{- end }}
{{- if ne (int $gw.replicaCount) 0 }}
{{- fail "Set the number of managed gateway copies with gateway.copies and leave agentgateway-standalone.replicaCount at 0" }}
{{- end }}
{{- if and $gw.autoscaling $gw.autoscaling.enabled }}
{{- fail "agentgateway-standalone.autoscaling must stay off: the app checks a fixed list of gateway copies (gateway.copies)" }}
{{- end }}
{{- if or $gw.nameOverride $gw.fullnameOverride $gw.namespaceOverride }}
{{- fail "Leave agentgateway-standalone.nameOverride, fullnameOverride and namespaceOverride unset; the gateway copies and NetworkPolicy use the release name" }}
{{- end }}
{{- if or $gw.extraContainers (and $gw.oidc $gw.oidc.enabled) }}
{{- fail "agentgateway-standalone.extraContainers and oidc are not supported on the managed gateway copies" }}
{{- end }}
{{- if .Values.gateway.copyUrls }}
{{- fail "gateway.copyUrls is for an existing gateway; in managed mode the chart lists its own copies from gateway.copies" }}
{{- end }}
{{- /*
Extra volumes go to the copies only, from gateway.extraVolumes and
gateway.extraVolumeMounts. Under agentgateway-standalone the bundled chart's
own Deployment would list them too, unchecked: a Secret volume without a mode
would carry Kubernetes' usual 0644 there, and would be mounted that way if
that Deployment were ever scaled up.
*/}}
{{- if or $gw.extraVolumes $gw.extraVolumeMounts }}
{{- fail "Give the managed gateway copies extra volumes with gateway.extraVolumes and gateway.extraVolumeMounts, and leave agentgateway-standalone.extraVolumes and extraVolumeMounts empty: the bundled gateway chart's own Deployment would list them without Keeplane's Secret file mode checks" }}
{{- end }}
{{- $volumeMounts := .Values.gateway.extraVolumeMounts }}
{{- $volumes := .Values.gateway.extraVolumes }}
{{- if and $gw.monitoring $gw.monitoring.enabled }}
{{- fail "agentgateway-standalone.monitoring is not supported on the managed gateway copies: their metrics port (15020) stays private, and the gateway NetworkPolicy admits only the app on port 4000" }}
{{- end }}
{{- /*
The bundled chart's own scope, so the copies use its helpers unchanged: the
same image reference (including writing a bare version tag such as 1.6.0 as
v1.6.0, and using its app version when no tag is set), the same pull policy
and the same restart hash.
*/}}
{{- $bundled := index .Subcharts "agentgateway-standalone" }}
{{- /* ADR 027: the private model enroller beside each copy; see _enroller.tpl. */}}
{{- $enroller := include "keeplane.enroller.on" . }}
{{- $pullSecrets := $gw.imagePullSecrets | default list }}
{{- if $enroller }}
{{- $pullSecrets = concat $pullSecrets (.Values.app.imagePullSecrets | default list) | uniq }}
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-gateway-copies
  labels:
    app.kubernetes.io/name: agentgateway-standalone
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app.kubernetes.io/name: agentgateway-standalone
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: standalone
  ports:
    - name: http
      protocol: TCP
      port: 4000
      targetPort: 4000
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-gateway
  labels:
    app.kubernetes.io/name: agentgateway-standalone
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  serviceName: {{ .Release.Name }}-gateway-copies
  replicas: {{ $copies }}
  # Copies share the model store and hold no per-copy state, so they start
  # together; a copy that is not ready has no address and stays unconfirmed.
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: agentgateway-standalone
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: standalone
  template:
    metadata:
      annotations:
        {{- /* As in the bundled chart, only settings agentgateway reads at
        startup restart the copies; other changes, including
        config.modelCatalog, are reloaded in place. */}}
        checksum/config: {{ include "agentgateway-standalone.startupConfig" $bundled | sha256sum }}
        {{- with $gw.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        app.kubernetes.io/name: agentgateway-standalone
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: standalone
        {{- with $gw.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with $pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ if $gw.serviceAccount.create }}{{ $gw.serviceAccount.name | default .Release.Name }}{{ else }}{{ $gw.serviceAccount.name | default "default" }}{{ end }}
      {{- /* The gateway reads its configuration from the mounted ConfigMap
      and its model store from PostgreSQL; it never calls the Kubernetes API,
      so the copies get no API token. The account stays a pod identity only,
      such as for a cloud IAM binding. */}}
      automountServiceAccountToken: false
      {{- /* A null entry (such as fsGroup: null) means unset, as in the bundled chart. */}}
      {{- $podSecurity := dict }}
      {{- range $key, $value := ($gw.podSecurityContext | default dict) }}
      {{- if not (kindIs "invalid" $value) }}
      {{- $_ := set $podSecurity $key $value }}
      {{- end }}
      {{- end }}
      {{- with $podSecurity }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if $enroller }}
      initContainers:
        {{- include "keeplane.enroller.initContainer" . | nindent 8 }}
      {{- end }}
      containers:
        - name: agentgateway
          image: {{ include "agentgateway-standalone.mainImage" $bundled | quote }}
          imagePullPolicy: {{ include "agentgateway-standalone.mainImagePullPolicy" $bundled }}
          {{- with $gw.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: 15021
            periodSeconds: 10
          startupProbe:
            failureThreshold: 60
            httpGet:
              path: /healthz/ready
              port: 15021
            periodSeconds: 1
            successThreshold: 1
            timeoutSeconds: 2
          args:
            - -f
            - /config/config.yaml
          env:
            - name: RUST_BACKTRACE
              value: "1"
            {{- with $gw.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: tmp
              mountPath: /tmp
            {{- if $enroller }}
            {{- include "keeplane.enroller.gatewayMount" . | nindent 12 }}
            {{- end }}
            {{- with $volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with $gw.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- if $enroller }}
        {{- include "keeplane.enroller.container" . | nindent 8 }}
        {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}-config
        - name: tmp
          emptyDir: {}
        {{- /* Secret volumes get mode 0440 unless they set a stricter one;
        see keeplane.gatewayExtraVolumes. */}}
        {{- if $volumes }}
        {{- include "keeplane.gatewayExtraVolumes" (dict "extraVolumes" $volumes "podSecurityContext" $gw.podSecurityContext) | nindent 8 }}
        {{- end }}
        {{- if $enroller }}
        {{- include "keeplane.enroller.volumes" . | nindent 8 }}
        {{- end }}
      {{- with $gw.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $gw.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $gw.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $gw.dnsConfig }}
      dnsConfig:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- /*
The bundled chart's disruption budget covers only its own Deployment, which
runs no pods here, so this one covers the copies. As in the bundled chart, it
renders only when more than one copy runs, so one copy never blocks a node
drain.
*/}}
{{- $budget := $gw.podDisruptionBudget | default dict }}
{{- if and $budget.enabled (gt $copies 1) }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Release.Name }}-gateway
  labels:
    app.kubernetes.io/name: agentgateway-standalone
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  {{- if $budget.maxUnavailable }}
  maxUnavailable: {{ $budget.maxUnavailable }}
  {{- else if $budget.minAvailable }}
  minAvailable: {{ $budget.minAvailable }}
  {{- end }}
  {{- with $budget.unhealthyPodEvictionPolicy }}
  unhealthyPodEvictionPolicy: {{ . }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: agentgateway-standalone
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: standalone
{{- end }}
{{- end }}
