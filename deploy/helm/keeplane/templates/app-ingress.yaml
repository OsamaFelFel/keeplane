{{- if .Values.ingress.enabled }}
{{- if ne .Values.app.service.type "ClusterIP" }}
{{- fail "ingress.enabled requires app.service.type=ClusterIP" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-app
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ required "ingress.className is required when ingress is enabled" .Values.ingress.className | quote }}
  tls:
    - hosts:
        - {{ required "ingress.host is required when ingress is enabled" .Values.ingress.host | quote }}
      secretName: {{ required "ingress.tlsSecretName is required when ingress is enabled" .Values.ingress.tlsSecretName | quote }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          {{- /* With the model enroller, the one route of the managed gateway's
          protected runtime, and nothing else of the gateway: developers' CLIs
          use https://<host>/v1 as their gateway (see
          gateway-runtime-service.yaml). An exact path, so no other gateway or
          app path follows it. */}}
          {{- if and (eq .Values.gateway.mode "managed") .Values.gateway.install (include "keeplane.enroller.on" .) }}
          - path: /v1/chat/completions
            pathType: Exact
            backend:
              service:
                name: {{ .Release.Name }}-gateway-runtime
                port:
                  number: 5000
          {{- end }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-app
                port:
                  number: 3000
{{- end }}
