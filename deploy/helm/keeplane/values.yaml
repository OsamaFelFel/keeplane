app:
  # PostgreSQL deployments require repository@sha256:<digest>; local trials may use a tag.
  image: keeplane-preview:local
  pullPolicy: IfNotPresent
  imagePullSecrets: []
  resources: {}
  replicaCount: 1
  cliSignIn:
    # Requires the optional PostgreSQL + CLI sign-in image and fixed clients.
    enabled: false
  runnerUrls: "http://qwen:8080"
  postgres:
    enabled: false
    host: ""
    port: 5432
    database: ""
    user: ""
    # Separate Secrets: app password, identity material, database CA certificate.
    credentialsSecret: ""
    identitySecret: ""
    caSecret: ""
    publicOrigin: ""
    publicOriginAliases: ""
    # Existing shared PVC; configure the gateway's read-only mount separately.
    providerKeysClaim: ""
    migration:
      enabled: true
      user: ""
      credentialsSecret: ""
  localTrial:
    enabled: false
    firstAdminSecret: ""
    publicOrigin: ""
    publicOriginAliases: ""
    openAIBaseUrl: ""
    anthropicBaseUrl: ""
    storageSize: 1Gi
  service:
    type: ClusterIP
    nodePort: null

gateway:
  # managed installs the upstream chart; existing connects to a supplied URL.
  mode: managed
  install: true
  url: ""
  expectedVersion: "1.6.0"
  preflightModel: ""
  # Installer-created Secret with runtime-key, admin-key, runtime-key-hash and
  # admin-key-hash. Required for the managed gateway: the chart refuses to
  # install it without this Secret and its hash variables in extraEnv below.
  keysSecret: ""
  # Managed mode: how many gateway copies run (1-32). Each copy gets its own
  # private address and the app reads every one back after a model change.
  copies: 2
  # Existing mode: every copy's own management origin, such as
  # http://gateway-0.gateway.ai-gateway.svc:4000 (http or https, no path or
  # credentials, at most 32). Leave empty when the gateway runs as one copy.
  copyUrls: []

networkPolicy:
  # Every policy here requires a Kubernetes CNI that enforces NetworkPolicy.
  # The local kindnet preview does not; keep them disabled in that preview.
  # Managed mode: admit only the app pods to the gateway copies on TCP 4000.
  gatewayIngressEnabled: false
  # Admit only the public entry (publicEntry below) to the app pods on TCP 3000.
  appIngressEnabled: false
  # Your ingress controller's pods, as label maps (matchLabels). Set at least
  # one; a namespace map alone admits every pod in that namespace.
  publicEntry:
    namespaceSelector: {}
    podSelector: {}
  # Limit outbound connections from the app, the install Jobs and (managed
  # mode) the gateway copies to DNS and the destinations listed in egress.
  egressEnabled: false
  # Cluster DNS, reached on UDP and TCP 53: label maps, or a cidr instead.
  dns:
    namespaceSelector:
      kubernetes.io/metadata.name: kube-system
    podSelector:
      k8s-app: kube-dns
  # Each destination is {cidr: "203.0.113.0/24", ports: [443]} or
  # {namespaceSelector: {...}, podSelector: {...}, ports: [8080]} (TCP).
  egress:
    # Model provider and runner endpoints. Required with egressEnabled: the
    # gateway copies call them, and the app checks provider keys against them.
    modelEndpoints: []
    # The app's PostgreSQL (app.postgres.host); required with app.postgres.
    postgres: []
    # Managed gateway database; required with agentgateway-standalone.mode=database.
    gatewayDatabase: []
    # Existing mode: the supplied gateway (gateway.url and every copyUrls host).
    suppliedGateway: []
    # Optional: the runner addresses in app.runnerUrls that the app checks.
    runners: []

ingress:
  # Publishes only the Keeplane app Service; the gateway stays internal.
  enabled: false
  className: ""
  host: ""
  tlsSecretName: ""
  annotations: {}

agentgateway-standalone:
  mode: database
  # Keeplane runs the gateway copies itself (gateway.copies) so each has a
  # stable address. The bundled chart's own Deployment must stay at zero.
  replicaCount: 0
  # The app initializes private provider files; gateway mounts must not widen them.
  podSecurityContext:
    fsGroup: null
  # PostgreSQL deployments with this managed gateway require repository@sha256:<digest>.
  image: cr.agentgateway.dev/agentgateway@sha256:9d3e6044ddcdc0878b1787f77bd401252b95e22684203fb5e874c4c42d2ed90c
  gateway:
    service:
      type: ClusterIP
      ports:
        - name: http
          port: 4000
          targetPort: 4000
          protocol: TCP
  database:
    postgres:
      url: ""
  # The managed gateway must load GATEWAY_RUNTIME_KEY_HASH and
  # GATEWAY_ADMIN_KEY_HASH from gateway.keysSecret (keys runtime-key-hash and
  # admin-key-hash) with secretKeyRef entries here. Helm cannot pass the Secret
  # name into this bundled chart, so the chart checks these entries instead.
  extraEnv: []
  config:
    gateways:
      default:
        port: 4000
    # Both key policies are part of the chart: management and model calls on
    # port 4000 always require a key. Helm refuses an install that removes them.
    ui:
      gateways: default
      policies:
        apiKey:
          mode: strict
          keys:
            - keyHash: ${GATEWAY_ADMIN_KEY_HASH}
    llm:
      policies:
        apiKey:
          mode: strict
          keys:
            - keyHash: ${GATEWAY_RUNTIME_KEY_HASH}
      models: []
