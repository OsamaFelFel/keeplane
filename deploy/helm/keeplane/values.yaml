app:
  # PostgreSQL deployments require repository@sha256:<digest>; local trials may use a tag.
  image: keeplane-preview:local
  pullPolicy: IfNotPresent
  imagePullSecrets: []
  resources: {}
  replicaCount: 1
  cliSignIn:
    # Requires the optional PostgreSQL + CLI sign-in image and fixed clients.
    enabled: false
  runnerUrls: "http://qwen:8080"
  postgres:
    enabled: false
    host: ""
    port: 5432
    database: ""
    user: ""
    # Separate Secrets: app password, identity material, database CA certificate.
    credentialsSecret: ""
    identitySecret: ""
    caSecret: ""
    publicOrigin: ""
    publicOriginAliases: ""
    # Existing shared PVC; configure the gateway's read-only mount separately.
    providerKeysClaim: ""
    migration:
      enabled: true
      user: ""
      credentialsSecret: ""
  localTrial:
    enabled: false
    firstAdminSecret: ""
    publicOrigin: ""
    publicOriginAliases: ""
    openAIBaseUrl: ""
    anthropicBaseUrl: ""
    storageSize: 1Gi
  service:
    type: ClusterIP
    nodePort: null

gateway:
  # managed installs the upstream chart; existing connects to a supplied URL.
  mode: managed
  install: true
  url: ""
  expectedVersion: "1.6.0"
  preflightModel: ""
  # Installer-created Secret with runtime-key, admin-key, runtime-key-hash and
  # admin-key-hash. Required for the managed gateway: the chart refuses to
  # install it without this Secret and its hash variables in extraEnv below.
  keysSecret: ""

networkPolicy:
  # Requires a Kubernetes CNI that enforces NetworkPolicy. The local kindnet
  # preview does not; keep disabled in that preview.
  gatewayIngressEnabled: false

ingress:
  # Publishes only the Keeplane app Service; the gateway stays internal.
  enabled: false
  className: ""
  host: ""
  tlsSecretName: ""
  annotations: {}

agentgateway-standalone:
  mode: database
  replicaCount: 2
  # The app initializes private provider files; gateway mounts must not widen them.
  podSecurityContext:
    fsGroup: null
  # PostgreSQL deployments with this managed gateway require repository@sha256:<digest>.
  image: cr.agentgateway.dev/agentgateway@sha256:9d3e6044ddcdc0878b1787f77bd401252b95e22684203fb5e874c4c42d2ed90c
  gateway:
    service:
      type: ClusterIP
      ports:
        - name: http
          port: 4000
          targetPort: 4000
          protocol: TCP
  database:
    postgres:
      url: ""
  # The managed gateway must load GATEWAY_RUNTIME_KEY_HASH and
  # GATEWAY_ADMIN_KEY_HASH from gateway.keysSecret (keys runtime-key-hash and
  # admin-key-hash) with secretKeyRef entries here. Helm cannot pass the Secret
  # name into this bundled chart, so the chart checks these entries instead.
  extraEnv: []
  config:
    gateways:
      default:
        port: 4000
    # Both key policies are part of the chart: management and model calls on
    # port 4000 always require a key. Helm refuses an install that removes them.
    ui:
      gateways: default
      policies:
        apiKey:
          mode: strict
          keys:
            - keyHash: ${GATEWAY_ADMIN_KEY_HASH}
    llm:
      policies:
        apiKey:
          mode: strict
          keys:
            - keyHash: ${GATEWAY_RUNTIME_KEY_HASH}
      models: []
