# Namespaced permissions for the person or pipeline that installs, upgrades and
# uninstalls Keeplane with Helm. A cluster admin applies this once, after
# creating the namespace; see docs/guide/kubernetes-namespace-permissions.md.
#
# It does not let anyone run commands inside the pods (pods/exec): the
# documented checks, backups and restores that do so use the separate,
# optional operations Role in operations-role.yaml.
#
# Replace the namespace "keeplane" and the RoleBinding subject before use.
# Keep each rule's lists in the [a, b] form shown here: the chart check
# (tests/integration/test_chart_namespace_permissions.py) reads this file and
# fails if the chart renders a kind this Role does not cover.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: keeplane-installer
  namespace: keeplane
rules:
  # Objects the chart creates, changes and removes, including the bundled
  # gateway chart's ConfigMap, Service, ServiceAccount and Deployment.
  # Secrets also hold Helm's release records and the Secrets the installer
  # creates before installing (keys, database credentials, TLS).
  - apiGroups: [""]
    resources: [configmaps, persistentvolumeclaims, secrets, serviceaccounts, services]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [apps]
    resources: [deployments, statefulsets]
    verbs: [get, list, watch, create, update, patch, delete]
  # Stop and start the app copies during a PostgreSQL restore (kubectl scale).
  # Patching the Deployment above can already change its replica count.
  - apiGroups: [apps]
    resources: [deployments/scale]
    verbs: [get, update, patch]
  # The migration and existing-gateway preflight Jobs run as install hooks.
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, networkpolicies]
    verbs: [get, list, watch, create, update, patch, delete]
  # Read-only: follow rollouts and hook Jobs (helm --wait) and read their logs.
  - apiGroups: [""]
    resources: [events, pods]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: keeplane-installer
  namespace: keeplane
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: keeplane-installer
subjects:
  # Replace with your installer's group, user or ServiceAccount.
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: keeplane-installers
