<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Users · Keeplane</title><link rel="stylesheet" href="/style.css">
  <script src="/accounts.js" defer></script>
</head>
<body data-page="users">
  <header class="topbar">
    <div class="brand"><svg width="28" height="28" viewBox="0 0 64 64" aria-hidden="true"><polygon points="10,54 16,54 25.08,12 22.49,12" fill="#fff"/><polygon points="48,54 54,54 41.51,12 38.92,12" fill="#fff"/><polygon points="29.5,54 34.5,54 34.2,45 29.8,45" fill="#F2B705"/><polygon points="30.01,39 33.99,39 33.76,32 30.24,32" fill="#F2B705"/><polygon points="30.41,27 33.59,27 33.42,22 30.58,22" fill="#F2B705"/><polygon points="30.73,17.5 33.27,17.5 33.15,14 30.85,14" fill="#F2B705"/></svg><span>Keeplane</span></div>
    <span class="account-header"><span id="signed-in-user"></span><a href="/sign-out">Sign out</a></span>
  </header>
  <div class="layout">
    <nav aria-label="Main"><a class="selected" href="/users" aria-current="page">Users</a><a href="/">Models and routing</a><a href="/data-classes">Data classes</a><a href="/audit">Audit</a><a href="/editions">Editions</a></nav>
    <main>
      <div class="page-heading"><div><h1>Users</h1><p class="intro">The admin creates every account.</p></div><button class="primary" id="show-create" type="button">Create user</button></div>
      <p id="edition-note" class="edition-note" hidden>Teams and group access control are available in Enterprise. <a href="/editions">See Editions</a>.</p>
      <p id="notice" class="notice" role="status" hidden></p>
      <div class="field search-field"><label for="search-users">Search users</label><input id="search-users" type="search" autocomplete="off"></div>
      <div class="table-wrap"><table><thead><tr><th scope="col">Username</th><th scope="col">Role</th></tr></thead><tbody id="rows"><tr><td colspan="2">Loading users…</td></tr></tbody></table></div>
      <div class="pager"><span id="page-label"></span><span class="pager-buttons"><button id="previous" type="button">Previous</button><button id="next" type="button">Next</button></span></div>
    </main>
  </div>
  <dialog id="create-dialog" aria-labelledby="dialog-title">
    <h2 id="dialog-title">Create user</h2>
    <form id="create-form">
      <div class="field"><label for="new-username">Username</label><input id="new-username" name="username" type="text" minlength="3" maxlength="64" autocomplete="off" required></div>
      <div class="field"><label for="new-password">Password</label><input id="new-password" name="password" type="password" minlength="12" autocomplete="new-password" required></div>
      <fieldset class="role-choice"><legend>Role</legend><label><input type="radio" name="role" value="admin" required> Admin</label><label><input type="radio" name="role" value="developer" required> Developer</label></fieldset>
      <p id="dialog-error" role="alert" hidden></p>
      <div class="actions dialog-actions"><button id="cancel-create" type="button">Cancel</button><button class="primary" type="submit">Create user</button></div>
    </form>
  </dialog>
</body>
</html>
