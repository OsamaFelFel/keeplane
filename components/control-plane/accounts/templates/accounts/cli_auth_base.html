<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}CLI access{% endblock %} — Keeplane</title>
<style>
@font-face{font-family:"IBM Plex Sans";src:url('/fonts/IBMPlexSans-Regular.woff2') format("woff2");font-weight:400;font-display:swap}@font-face{font-family:"IBM Plex Sans";src:url('/fonts/IBMPlexSans-Medium.woff2') format("woff2");font-weight:500;font-display:swap}@font-face{font-family:"IBM Plex Sans";src:url('/fonts/IBMPlexSans-SemiBold.woff2') format("woff2");font-weight:600;font-display:swap}
*{box-sizing:border-box}body{margin:0;background:#f4f5f6;color:#1e252b;font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:15px;line-height:22px;font-weight:400}main{min-height:100svh;display:flex;align-items:center;justify-content:center;padding:16px}.card{width:100%;max-width:400px;background:#fff;border:1px solid #d3d8dd;border-radius:10px;padding:32px}h1{font-size:24px;line-height:32px;font-weight:600;margin:0 0 20px}strong{font-weight:600}p{margin:0 0 20px}.actions{display:flex;gap:12px;flex-wrap:wrap}
button{min-height:44px;padding:0 18px;border:1px solid #7a858f;border-radius:6px;background:#fff;color:#1e252b;font-family:inherit;font-size:15px;line-height:22px;font-weight:500}button[name=allow],button[name=action][value=accept]{background:#f2b705;border-color:#1e252b;font-weight:600}button:focus-visible,input:focus-visible{outline:2px solid #1e252b;outline-offset:2px}
label{display:block;margin:0 0 6px;font-size:14px;line-height:20px;font-weight:500}input:not([type=hidden]){display:block;width:100%;min-height:44px;margin:0 0 20px;padding:0 12px;border:1px solid #7a858f;border-radius:6px;background:#fff;color:#1e252b;font-family:inherit;font-size:15px;line-height:22px;font-weight:400}input[aria-invalid=true]{border:2px solid #1e252b}</style></head><body><main><section class="card" aria-labelledby="title">
{% block content %}{% endblock %}</section></main></body></html>
