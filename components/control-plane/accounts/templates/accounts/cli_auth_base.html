<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}CLI access{% endblock %} — Keeplane</title>
<style>
@font-face{font-family:Plex;src:url('/fonts/IBMPlexSans-Regular.woff2')}@font-face{font-family:Plex;src:url('/fonts/IBMPlexSans-SemiBold.woff2');font-weight:600}
*{box-sizing:border-box}body{margin:0;background:#f4f5f6;color:#1e252b;font:15px/22px Plex,system-ui,sans-serif}main{min-height:100svh;display:flex;align-items:center;justify-content:center;padding:16px}.card{width:100%;max-width:400px;background:#fff;border:1px solid #d3d8dd;border-radius:10px;padding:32px}h1{font-size:24px;line-height:32px;margin:0 0 20px}p{margin:0 0 20px}.actions{display:flex;gap:12px;flex-wrap:wrap}button{min-height:44px;padding:0 18px;border:1px solid #7a858f;border-radius:6px;background:#fff;color:#1e252b;font:500 15px Plex,system-ui,sans-serif}button[name=allow],button[name=action][value=accept]{background:#f2b705;border-color:#1e252b;font-weight:600}button:focus-visible{outline:2px solid #1e252b;outline-offset:2px}
