name: Build and application checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Check CI selection behavior
        run: python3 -m unittest discover -s tests/unit -p 'test_ci_scope.py'
      - name: Select application checks
        id: scope
        run: python3 .github/scripts/ci_scope.py

  frontend:
    needs: scope
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.docs_only != 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: components/admin-ui
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.22.2
          cache: npm
          cache-dependency-path: components/admin-ui/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run test:notices
      - run: npm run test:offline-assets
      - name: Run UI unit tests
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-results/frontend"
          npm run test:unit -- --reporter=default --reporter=json --outputFile="$GITHUB_WORKSPACE/test-results/frontend/unit.json"
      - run: npm run lint
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: frontend-${{ github.sha }}
          path: test-results/frontend/
          retention-days: 30

  backend-tests:
    needs: scope
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.docs_only != 'true') }}
    runs-on: ubuntu-24.04
    # Each shard takes a few minutes; the limit is only a safety margin.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Shards are defined in tests/support/shards.py; every test file
        # belongs to exactly one, and a unit test keeps this list in step.
        shard: [unit, integration-a-to-l, integration-m-to-z]
    env:
      PYTHONPATH: components/control-plane
      KEEPLANE_CLI_BUILD_PYTHON: ${{ github.workspace }}/.venv/bin/python
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Python test dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r tests/requirements.txt
          .venv/bin/pip install --require-hashes -r components/cli/requirements-build.txt
      - name: Install the pinned Helm tool for chart checks
        run: |
          curl --fail --location --output /tmp/helm.tar.gz https://get.helm.sh/helm-v3.19.0-linux-amd64.tar.gz
          echo "a7f81ce08007091b86d8bd696eb4d86b8d0f2e1b9f6c714be62f82f96a594496  /tmp/helm.tar.gz" | sha256sum --check
          tar -xzf /tmp/helm.tar.gz -C /tmp
          echo "KEEPLANE_HELM_BIN=/tmp/linux-amd64/helm" >> "$GITHUB_ENV"
      - name: Discover and run this shard's unit and integration checks
        run: .venv/bin/python -m pytest tests/unit tests/integration --shard "$SHARD" --junitxml="test-results/backend/$SHARD/junit.xml"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: backend-${{ matrix.shard }}-${{ github.sha }}
          path: test-results/
          retention-days: 30

  backend:
    needs: [scope, backend-tests]
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.docs_only != 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install the Python source checker pinned in the test requirements
        run: |
          python3 -m venv .venv
          .venv/bin/pip install "$(grep '^ruff==' tests/requirements.txt)"
      - name: Check Python source
        run: .venv/bin/ruff check components/control-plane --select F,E9
      - name: Require every backend shard to pass
        env:
          SHARDS_RESULT: ${{ needs.backend-tests.result }}
        run: |
          if [ "$SHARDS_RESULT" != success ]; then
            echo "Backend test shards finished with: $SHARDS_RESULT" >&2
            exit 1
          fi

  component-manifest:
    needs: scope
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.docs_only != 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.22.2
          cache: npm
          cache-dependency-path: components/admin-ui/package-lock.json
      - name: Build the admin UI the app image serves
        working-directory: components/admin-ui
        run: npm ci && npm run build
      - name: Build the app image under the chart's default reference
        run: docker build -f components/control-plane/Dockerfile -t keeplane-preview:local .
      - name: Install the pinned Helm tool
        run: |
          curl --fail --location --output /tmp/helm.tar.gz https://get.helm.sh/helm-v3.19.0-linux-amd64.tar.gz
          echo "a7f81ce08007091b86d8bd696eb4d86b8d0f2e1b9f6c714be62f82f96a594496  /tmp/helm.tar.gz" | sha256sum --check
          tar -xzf /tmp/helm.tar.gz -C /tmp
          echo "KEEPLANE_HELM_BIN=/tmp/linux-amd64/helm" >> "$GITHUB_ENV"
      - name: Package the chart
        run: |
          mkdir -p test-results/component-manifest
          "$KEEPLANE_HELM_BIN" package deploy/helm/keeplane --destination test-results/component-manifest
      - name: Stamp and check the component manifest for this build
        run: |
          out=test-results/component-manifest
          commit="$(git rev-parse HEAD)"
          chart="$(ls "$out"/keeplane-*.tgz)"
          python3 deploy/stamp_component_manifest.py --commit "$commit" \
            --app-image-from-docker keeplane-preview:local \
            --chart-package "$chart" --output "$out/component-manifest.json"
          python3 deploy/stamp_component_manifest.py --commit "$commit" \
            --app-image-from-docker keeplane-preview:local \
            --chart-package "$chart" --check "$out/component-manifest.json"
          python3 - "$out/component-manifest.json" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys
          build = json.load(open(sys.argv[1]))["build"]
          print("### Component manifest for this build\n")
          for field in ("keeplane_commit", "app_image_digest", "chart_package_digest"):
              print(f"- `{field}`: `{build[field]}`")
          print("\nDownload the `component-manifest-<commit>` artifact for the stamped copy and chart package.")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: component-manifest-${{ github.sha }}
          path: test-results/component-manifest/
          if-no-files-found: error
          retention-days: 30

  local-application:
    needs: scope
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.docs_only != 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      KEEPLANE_RUNTIME_DIR: ${{ github.workspace }}/.keeplane/local
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.22.2
          cache: npm
          cache-dependency-path: |
            components/admin-ui/package-lock.json
            tests/browser/package-lock.json
      - name: Start with the documented command
        run: |
          set -o pipefail
          mkdir -p test-results
          python3 deploy/local/up.py | tee test-results/startup-default.log
      - name: Check a command-line port override
        env:
          KEEPLANE_PORT: 3090
        run: |
          set -o pipefail
          python3 deploy/local/up.py --port 3080 | tee test-results/startup-custom-port.log
      - name: Verify the packaged preview image
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r tests/requirements.txt
          runtime_preview_image="$(docker image inspect keeplane-preview:docker-local --format '{{.Id}}')"
          KEEPLANE_RUNTIME_PREVIEW_IMAGE="$runtime_preview_image" .venv/bin/python -m pytest 'tests/integration/test_runtime_image.py::test_runtime_image[preview]' -m live --junitxml=test-results/runtime-preview/junit.xml
      - name: Install the browser tests
        working-directory: tests/browser
        run: |
          npm ci
          npx playwright install --with-deps chromium --only-shell
      - name: Exercise application behavior
        working-directory: tests/browser
        env:
          KEEPLANE_BASE_URL: http://127.0.0.1:3080
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ github.workspace }}/test-results/browser/results.json
        # Existing image baselines are macOS-specific; behavior runs on Linux.
        run: npm test -- --workers=1 --grep-invert 'BR-03|MO-UI-01|DC-UI-01|AU-UI-03' --reporter=list,json
      - name: Collect container diagnostics
        if: failure()
        run: docker compose --env-file "$KEEPLANE_RUNTIME_DIR/.env" --profile qwen logs --no-color account-volume-init app-migrate app gateway qwen > test-results/containers.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: local-application-${{ github.sha }}
          path: |
            test-results/
            tests/browser/test-results/
          retention-days: 30
      - name: Stop the disposable application
        if: always()
        run: |
          if [ -f "$KEEPLANE_RUNTIME_DIR/.env" ]; then
            docker compose --env-file "$KEEPLANE_RUNTIME_DIR/.env" --profile qwen down
          fi

  postgres:
    needs: scope
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.docs_only != 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      # A disposable server for the separate-process settings-change, Audit and
      # credential rotation cases; each case creates and drops its own database.
      settings-postgres:
        image: postgres@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: keeplane
          POSTGRES_PASSWORD: ci-disposable-settings-postgres
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U keeplane"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.22.2
          cache: npm
          cache-dependency-path: components/admin-ui/package-lock.json
      - name: Build the real admin UI for account page checks
        working-directory: components/admin-ui
        run: npm ci && npm run build
      - name: Build the PostgreSQL API package from pinned driver source
        run: docker build --target postgres -t keeplane-preview:postgres-local -f components/control-plane/Dockerfile .
      - name: Install Python test dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r tests/requirements.txt
      - name: Verify accounts, transactions, replica behavior and restore
        env:
          KEEPLANE_TEST_REPORT_DIR: test-results/postgres/cases
        run: |
          runtime_postgres_image="$(docker image inspect keeplane-preview:postgres-local --format '{{.Id}}')"
          KEEPLANE_RUNTIME_POSTGRES_IMAGE="$runtime_postgres_image" .venv/bin/python -m pytest tests/integration/test_postgres_accounts.py 'tests/integration/test_runtime_image.py::test_runtime_image[postgres]' -m live --app-image "$runtime_postgres_image" --junitxml=test-results/postgres/junit.xml
      - name: Install pg_dump and pg_restore matching the PostgreSQL service
        env:
          PGPASSWORD: ci-disposable-settings-postgres
        run: |
          # pg_dump refuses a newer server, so use the service's own major version.
          major="$(psql -h 127.0.0.1 -p 55432 -U keeplane -d postgres -Atc 'SHOW server_version_num' | cut -c1-2)"
          case "$major" in ''|*[!0-9]*) echo "Unexpected PostgreSQL version: $major" >&2; exit 1 ;; esac
          if [ ! -x "/usr/lib/postgresql/$major/bin/pg_restore" ]; then
            sudo apt-get update
            sudo apt-get install -y postgresql-common
            # Adds the PostgreSQL project's apt repository with the signing key postgresql-common ships.
            sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
            sudo apt-get install -y "postgresql-client-$major"
          fi
          "/usr/lib/postgresql/$major/bin/pg_dump" --version
          echo "KEEPLANE_TEST_POSTGRES_BIN=/usr/lib/postgresql/$major/bin" >> "$GITHUB_ENV"
      - name: Verify settings-change records, break-glass sign-ins, level locks, credential rotation and backup/restore on PostgreSQL
        env:
          KEEPLANE_TEST_REPORT_DIR: test-results/postgres/settings-cases
          KEEPLANE_TEST_POSTGRES_HOST: 127.0.0.1
          KEEPLANE_TEST_POSTGRES_PORT: "55432"
          KEEPLANE_TEST_POSTGRES_USER: keeplane
        run: |
          .venv/bin/pip install psycopg==3.3.6
          password_file="$RUNNER_TEMP/settings-postgres-password"
          printf '%s\n' ci-disposable-settings-postgres > "$password_file"
          KEEPLANE_TEST_POSTGRES_PASSWORD_FILE="$password_file" .venv/bin/python -m pytest tests/integration/test_settings_change_records.py tests/integration/test_model_answer_records.py tests/integration/test_audit_persistence.py tests/integration/test_break_glass_sign_ins.py tests/integration/test_credential_rotation.py tests/integration/test_backup_restore.py -k postgresql -rs --junitxml=test-results/postgres/settings-junit.xml
          if grep -q '<skipped' test-results/postgres/settings-junit.xml; then
            echo "PostgreSQL settings cases were skipped" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: postgres-${{ github.sha }}
          path: test-results/postgres/
          retention-days: 30
