name: Live preview gateway checks

# Starts the protected Docker preview on a hosted runner, which can pull the
# locked gateway, Python and llama.cpp images, and runs the live gateway cases
# that need them: Spec 009 ST29/ST30 CLI sign-in and the guarded gateway on a
# fresh default start (task 009-01), Spec 005 ST19 project classes through the
# guarded endpoint (task 005-02) and Spec 004 ST16 retry of a model that is
# down (task 004-04). Last, the developer half of the MVP journey, DEV-01 to
# DEV-05 (task 009-13), runs with the hash-pinned coding runtime.
# A second job, in parallel, builds the `detection` app image and runs Spec 005
# ST20 personal-data detection and Spec 006 ST21 held-back request records
# through the same guarded endpoint (tasks 005-03 and 006-02).
# An unrun case is not a pass: each job fails if any case is skipped or missing.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-gateway:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      KEEPLANE_RUNTIME_DIR: ${{ github.workspace }}/.keeplane/local
      RESULTS: ${{ github.workspace }}/test-results/live-preview
      # The coding runtime the coding-runtime check in checks.yml pins: OpenCode
      # V2 2.0.27, linux x64 baseline musl build, from npm.
      RUNTIME_ARCHIVE_URL: https://registry.npmjs.org/@opencode/cli-linux-x64-baseline-musl/-/cli-linux-x64-baseline-musl-2.0.27.tgz
      RUNTIME_ARCHIVE_SHA256: 19883929aff7834d777af1618a811d4d1352a46c02df3ba11aad8cafc2faf93e
      RUNTIME_BINARY_SHA256: a2dee30005064075c216fdcc3fcaba7071c81b39d00b4286206faa50e461b61d
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.22.2
          cache: npm
          cache-dependency-path: components/admin-ui/package-lock.json
      - name: Start the Docker preview with the documented command
        run: |
          set -o pipefail
          mkdir -p "$RESULTS"
          python3 deploy/local/up.py | tee "$RESULTS/startup.log"
      - name: Install Python test dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r tests/requirements.txt
      - name: List the live cases that must run
        run: |
          .venv/bin/python -m pytest tests/integration/test_native_runtime_outage.py tests/e2e/test_project_classes_live.py \
            tests/e2e/test_preview_sign_in_live.py tests/integration/test_preview_sign_in_image.py \
            tests/e2e/test_developer_journey.py \
            -m live --collect-only -q | grep '::' > "$RESULTS/expected-cases.txt"
          cat "$RESULTS/expected-cases.txt"
      # First, while the preview is fresh: zero approved models, then one.
      - name: CLI sign-in and the guarded gateway on the default preview (Spec 009 ST29/ST30, task 009-01)
        env:
          KEEPLANE_TEST_REPORT_DIR: ${{ github.workspace }}/test-results/live-preview/sign-in-cases
        run: .venv/bin/python -m pytest tests/e2e/test_preview_sign_in_live.py tests/integration/test_preview_sign_in_image.py -m live -rs --junitxml="$RESULTS/sign-in-junit.xml"
      - name: Project classes through the guarded preview gateway (Spec 005 ST19, task 005-02)
        if: ${{ !cancelled() }}
        env:
          KEEPLANE_TEST_REPORT_DIR: ${{ github.workspace }}/test-results/live-preview/class-cases
        run: .venv/bin/python -m pytest tests/e2e/test_project_classes_live.py -m live -rs --junitxml="$RESULTS/classes-junit.xml"
      - name: Retry a down model twice, then stop (Spec 004 ST16, task 004-04)
        if: ${{ !cancelled() }}
        env:
          KEEPLANE_TEST_REPORT_DIR: ${{ github.workspace }}/test-results/live-preview/outage-cases
        run: .venv/bin/python -m pytest tests/integration/test_native_runtime_outage.py -m live -rs --junitxml="$RESULTS/outage-junit.xml"
      - name: Download and check the pinned coding runtime
        if: ${{ !cancelled() }}
        run: |
          curl --fail --location --output "$RUNNER_TEMP/runtime.tgz" "$RUNTIME_ARCHIVE_URL"
          echo "$RUNTIME_ARCHIVE_SHA256  $RUNNER_TEMP/runtime.tgz" | sha256sum --check
          mkdir "$RUNNER_TEMP/runtime"
          tar -xzf "$RUNNER_TEMP/runtime.tgz" -C "$RUNNER_TEMP/runtime"
          echo "$RUNTIME_BINARY_SHA256  $RUNNER_TEMP/runtime/package/bin/opencode" | sha256sum --check
      - name: Developer journey DEV-01 to DEV-05 with the pinned runtime (Spec 009, task 009-13)
        if: ${{ !cancelled() }}
        # The runtime is built for musl, so the suite runs in Alpine with
        # libstdc++. Host networking reaches the preview on loopback and lets
        # the fixture model listen where the preview allows a host runner; the
        # Docker socket lets the suite read the model enroller and clean up.
        # The checkout keeps its path, so Compose finds the same preview.
        env:
          KEEPLANE_TEST_REPORT_DIR: ${{ github.workspace }}/test-results/live-preview/journey-cases
        run: |
          docker run --rm --network host \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE" \
            -v "$RUNNER_TEMP/runtime/package/bin:/opt/runtime:ro" \
            -e KEEPLANE_OPENCODE_V2_BIN=/opt/runtime/opencode \
            -e KEEPLANE_RUNTIME_DIR -e KEEPLANE_TEST_REPORT_DIR -e RESULTS \
            python:3.12.13-alpine3.22@sha256:a190708a2dec1bd18b1decb539f8e8f5407abaa9bf39cacda583f7f8c11db322 \
            sh -euc '
              apk add --no-cache libstdc++ git docker-cli docker-cli-compose >/dev/null
              python -m venv /tmp/venv
              /tmp/venv/bin/pip install --quiet -r tests/requirements.txt
              /tmp/venv/bin/python -m pytest tests/e2e/test_developer_journey.py -m live \
                -p no:cacheprovider -s -rs --junitxml="$RESULTS/journey-junit.xml"
            '
      - name: Fail if a live gateway case was skipped or did not run
        if: ${{ !cancelled() }}
        run: |
          python3 - "$RESULTS/expected-cases.txt" "$RESULTS/outage-junit.xml" "$RESULTS/classes-junit.xml" "$RESULTS/sign-in-junit.xml" "$RESULTS/journey-junit.xml" <<'EOF'
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          expected = set(Path(sys.argv[1]).read_text().split())
          ran, skipped = set(), set()
          for report in sys.argv[2:]:
              if not Path(report).is_file():
                  print(f"No report: {report}", file=sys.stderr)
                  continue
              for case in ET.parse(report).iter("testcase"):
                  module = case.get("classname", "").replace(".", "/") + ".py"
                  node = f"{module}::{case.get('name')}"
                  ran.add(node)
                  if case.find("skipped") is not None:
                      skipped.add(node)
          missing = sorted(expected - ran)
          for node in missing:
              print(f"Live case did not run: {node}", file=sys.stderr)
          for node in sorted(skipped):
              print(f"Live case was skipped: {node}", file=sys.stderr)
          print(f"{len(expected)} live cases expected, {len(ran - skipped)} ran")
          sys.exit(1 if missing or skipped or not expected else 0)
          EOF
      - name: Collect container diagnostics
        if: failure()
        run: |
          docker ps --all > "$RESULTS/containers.txt" 2>&1 || true
          docker compose --env-file "$KEEPLANE_RUNTIME_DIR/.env" -f compose.yaml -f deploy/local/runtime.yaml \
            --profile qwen --profile runtime logs --no-color > "$RESULTS/containers.log" 2>&1 || true
          # The disposable preview's own messages, so a failure can be read from the job log.
          for service in model-enroller gateway app; do
            echo "::group::$service (last 150 lines)"
            docker compose --env-file "$KEEPLANE_RUNTIME_DIR/.env" -f compose.yaml -f deploy/local/runtime.yaml \
              --profile runtime logs --no-color --tail 150 "$service" 2>&1 || true
            echo "::endgroup::"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: live-preview-${{ github.sha }}
          path: test-results/live-preview/
          retention-days: 30
      - name: Stop the disposable application
        if: always()
        run: |
          if [ -f "$KEEPLANE_RUNTIME_DIR/.env" ]; then
            docker compose --env-file "$KEEPLANE_RUNTIME_DIR/.env" -f compose.yaml -f deploy/local/runtime.yaml \
              --profile qwen --profile runtime down
          fi

  live-detection:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      KEEPLANE_RUNTIME_DIR: ${{ github.workspace }}/.keeplane/local
      KEEPLANE_PREVIEW_DETECTION_IMAGE: keeplane-preview:detection-local
      RESULTS: ${{ github.workspace }}/test-results/live-detection
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.22.2
          cache: npm
          cache-dependency-path: components/admin-ui/package-lock.json
      - name: Build the app image with personal-data detection
        run: |
          mkdir -p "$RESULTS"
          docker build --target detection -t "$KEEPLANE_PREVIEW_DETECTION_IMAGE" -f components/control-plane/Dockerfile .
      - name: Start the Docker preview with the documented command
        run: |
          set -o pipefail
          python3 deploy/local/up.py | tee "$RESULTS/startup.log"
      - name: Install Python test dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r tests/requirements.txt
      - name: List the live cases that must run
        run: |
          .venv/bin/python -m pytest tests/e2e/test_personal_data_live.py \
            -m live --collect-only -q | grep '::' > "$RESULTS/expected-cases.txt"
          cat "$RESULTS/expected-cases.txt"
      - name: Personal-data detection and held-back records through the guarded preview gateway (Spec 005 ST20, Spec 006 ST21)
        env:
          KEEPLANE_TEST_REPORT_DIR: ${{ github.workspace }}/test-results/live-detection/detection-cases
        run: .venv/bin/python -m pytest tests/e2e/test_personal_data_live.py -m live -rs --junitxml="$RESULTS/detection-junit.xml"
      - name: Fail if a live detection case was skipped or did not run
        if: ${{ !cancelled() }}
        run: |
          python3 - "$RESULTS/expected-cases.txt" "$RESULTS/detection-junit.xml" <<'EOF'
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          expected = set(Path(sys.argv[1]).read_text().split())
          ran, skipped = set(), set()
          for report in sys.argv[2:]:
              if not Path(report).is_file():
                  print(f"No report: {report}", file=sys.stderr)
                  continue
              for case in ET.parse(report).iter("testcase"):
                  module = case.get("classname", "").replace(".", "/") + ".py"
                  node = f"{module}::{case.get('name')}"
                  ran.add(node)
                  if case.find("skipped") is not None:
                      skipped.add(node)
          missing = sorted(expected - ran)
          for node in missing:
              print(f"Live case did not run: {node}", file=sys.stderr)
          for node in sorted(skipped):
              print(f"Live case was skipped: {node}", file=sys.stderr)
          print(f"{len(expected)} live cases expected, {len(ran - skipped)} ran")
          sys.exit(1 if missing or skipped or not expected else 0)
          EOF
      - name: Collect container diagnostics
        if: failure()
        run: |
          docker ps --all > "$RESULTS/containers.txt" 2>&1 || true
          docker compose --env-file "$KEEPLANE_RUNTIME_DIR/.env" -f compose.yaml -f deploy/local/runtime.yaml \
            --profile qwen --profile runtime logs --no-color > "$RESULTS/containers.log" 2>&1 || true
          # The disposable preview's own messages, so a failure can be read from the job log.
          for service in model-enroller gateway app; do
            echo "::group::$service (last 150 lines)"
            docker compose --env-file "$KEEPLANE_RUNTIME_DIR/.env" -f compose.yaml -f deploy/local/runtime.yaml \
              --profile runtime logs --no-color --tail 150 "$service" 2>&1 || true
            echo "::endgroup::"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: live-detection-${{ github.sha }}
          path: test-results/live-detection/
          retention-days: 30
      - name: Stop the disposable application
        if: always()
        run: |
          if [ -f "$KEEPLANE_RUNTIME_DIR/.env" ]; then
            docker compose --env-file "$KEEPLANE_RUNTIME_DIR/.env" -f compose.yaml -f deploy/local/runtime.yaml \
              --profile qwen --profile runtime down
          fi
