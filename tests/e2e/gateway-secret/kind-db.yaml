apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway-secret-db
  template:
    metadata:
      labels:
        app: gateway-secret-db
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: postgres@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_USER
              value: keeplane
            - name: POSTGRES_PASSWORD
              value: fixture-only
            - name: POSTGRES_DB
              value: keeplane
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "keeplane", "-d", "keeplane"]
            periodSeconds: 2
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: db
spec:
  selector:
    app: gateway-secret-db
  ports:
    - port: 5432
      targetPort: 5432
