# Disposable policy trial; keys are generated by verify_strict_keys.py.
config:
  storage:
    mode: hybrid
  database:
    url: sqlite:///data/agentgateway.db
gateways:
  default:
    port: 4000
ui:
  gateways: default
  policies:
    apiKey:
      mode: strict
      keys:
        - key: ${TRIAL_ADMIN_KEY}
llm:
  policies:
    apiKey:
      mode: strict
      keys:
        - key: ${TRIAL_RUNTIME_KEY}
          allowedModels:
            - local-fixture
  models:
    - name: local-fixture
      provider:
        custom:
          formats:
            - type: completions
      params:
        model: mock-local
        baseUrl: http://model:18080/v1
