# Trial values. A Kubernetes Secret named gateway-db-credentials would provide
# the password in a real install; Helm renders only this placeholder.
agentgateway-standalone:
  database:
    postgres:
      url: postgresql://keeplane:${TRIAL_DB_PASSWORD}@db:5432/keeplane
  # Replaces the local list, so it repeats the key hashes the chart requires.
  extraEnv:
    - name: TRIAL_DB_PASSWORD
      valueFrom:
        secretKeyRef:
          name: gateway-db-credentials
          key: password
    - name: GATEWAY_RUNTIME_KEY_HASH
      valueFrom:
        secretKeyRef:
          name: keeplane-gateway-keys
          key: runtime-key-hash
    - name: GATEWAY_ADMIN_KEY_HASH
      valueFrom:
        secretKeyRef:
          name: keeplane-gateway-keys
          key: admin-key-hash
