# Local preview only. Gateway management stays on the private Compose network.
config:
  storage:
    mode: hybrid
  database:
    url: sqlite:///data/agentgateway.db
gateways:
  default:
    port: 4000
ui:
  gateways: default
  policies:
    apiKey:
      mode: strict
      keys:
        - keyHash: ${GATEWAY_ADMIN_KEY_HASH}
llm:
  policies:
    apiKey:
      mode: strict
      keys:
        - keyHash: ${GATEWAY_RUNTIME_KEY_HASH}
  models:
    - name: local-fixture
      provider:
        custom:
          formats:
            - type: completions
      params:
        model: mock-local
        baseUrl: http://model:18080/v1
