[pytest]
DJANGO_SETTINGS_MODULE = config.test_settings
pythonpath = . components/control-plane
testpaths = tests/unit tests/integration tests/e2e
addopts = -m "not live" --strict-markers
cache_dir = test-results/pytest-cache
markers =
    unit: isolated policy, client and form behavior
    integration: database and component boundaries
    e2e: journeys through the running application
    live: requires Docker, Kubernetes or a running application
    kubernetes: requires the local Kubernetes integration environment
    optional: requires an optional native model or separate evaluation setup
    infrastructure: disposable component or deployment fixtures
    docker_only: exercises the Docker preview only
